

 <div class="backup-container">
  <h2>📦 Data Backup</h2>

  <button class="ios-button export" (click)="export()">
    📤 Export / Share Backup
  </button>

  <button class="ios-button import" (click)="openFilePicker()">
    📥 Import Backup
  </button>
  <input 
    #fileInput 
    type="file" 
    accept=".json" 
    style="display:none" 
    (change)="onFileSelected($event)" 
  />

  <button class="ios-button clear" (click)="confirmDelete()">
    🗑️ Clear Database
  </button>
</div>
