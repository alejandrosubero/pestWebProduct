<div class="converter">
  <!-- <h2>Unit Converter</h2> -->

  <!-- 1️⃣ Choose the type of conversion -->
  <label class="field">
    <span>Type:</span>
    <select
      [(ngModel)]="selectedType"
      (change)="onTypeChange()"
      name="type"
      required
    >
      <option *ngFor="let type of unitTypes" [value]="type">
        {{ type }}
      </option>
    </select>
  </label>

  <!-- 2️⃣ Enter value -->
  <label class="field">
    <span>Value:</span>
    <input
      type="number"
      [(ngModel)]="value"
      placeholder="Enter number"
      required
    />
  </label>

  <!-- 3️⃣ Select source unit -->
  <label class="field">
    <span>From:</span>
    <select [(ngModel)]="fromUnit" name="fromUnit" required>
      <option value="" disabled selected>Select unit</option>
      <option *ngFor="let u of getUnitOptions()" [value]="u">
        {{ u }}
      </option>
    </select>
  </label>

  <!-- 4️⃣ Select target unit -->
  <label class="field">
    <span>To:</span>
    <select [(ngModel)]="toUnit" name="toUnit" required>
      <option value="" disabled selected>Select unit</option>
      <option *ngFor="let u of getUnitOptions()" [value]="u">
        {{ u }}
      </option>
    </select>
  </label>

  <!-- 5️⃣ Convert button -->
  <button class="convert" (click)="convert()">Convert</button>

  <!-- 6️⃣ Result -->
  <div class="result" *ngIf="result">
    <strong>Result:</strong> {{ result }}
  </div>
</div>
