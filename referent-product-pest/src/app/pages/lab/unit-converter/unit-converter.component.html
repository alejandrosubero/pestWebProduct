<div class="converter">
  <h2>Unit Converter</h2>

  <!-- 1️⃣ Type selector -->
  <label class="field">
    <span>Convert type:</span>
    <select [(ngModel)]="selectedType" name="type">
      <option *ngFor="let t of unitTypes" [value]="t">{{ t }}</option>
    </select>
  </label>

  <!-- 2️⃣ Value -->
  <label class="field">
    <span>Value:</span>
    <input
      type="number"
      [(ngModel)]="value"
      placeholder="Enter value"
      step="any"
    />
  </label>

  <!-- 3️⃣ From‑unit -->
  <label class="field">
    <span>From:</span>
    <select [(ngModel)]="fromUnit" name="from">
      <option value="" disabled selected>Select unit</option>
      <option *ngFor="let u of getUnitOptions()" [value]="u">{{ u }}</option>
    </select>
  </label>

  <!-- 4️⃣ To‑unit -->
  <label class="field">
    <span>To:</span>
    <select [(ngModel)]="toUnit" name="to">
      <option value="" disabled selected>Select unit</option>
      <option *ngFor="let u of getUnitOptions()" [value]="u">{{ u }}</option>
    </select>
  </label>

  <!-- 5️⃣ Convert button -->
  <button class="convert" (click)="convert()">Convert</button>

  <!-- 6️⃣ Result -->
  <div class="result" *ngIf="result">
    <strong>Result:</strong> {{ result }}
  </div>
</div>
