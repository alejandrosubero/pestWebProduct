<form [formGroup]="form" (ngSubmit)="save()" class="form-wrapper">


  <mat-form-field appearance="outline">
    <mat-label>Product Name</mat-label>
    <input type="text" matInput [formControlName]="'name'" [formGroup]="form" [matAutocomplete]="auto">
    <button *ngIf="checkValue()" matSuffix mat-icon-button aria-label="Clear" (click)="clearInput()">
      <mat-icon>close</mat-icon>
    </button>

    <mat-autocomplete autoActiveFirstOption #auto="matAutocomplete">
      <mat-option *ngFor="let option of filteredOptions | async" [value]="option">
        {{option}}
      </mat-option>
    </mat-autocomplete>
  </mat-form-field>


  <mat-form-field appearance="outline">
    <mat-label>Quantity</mat-label>
    <input matInput type="number" formControlName="quantity" />
  </mat-form-field>


  <!-- <button mat-raised-button color="primary" type="submit" class="full-width">
   Save
  </button> -->

    <button class="buto" type="submit">
        Save
    </button>
</form>
